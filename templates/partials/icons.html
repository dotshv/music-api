{# Icon + logo macros. The symbols live in partials/sprite.html. #}
{% macro icon(name, cls="") -%}
<svg class="icon {{ cls }}" aria-hidden="true"><use href="#i-{{ name }}"/></svg>
{%- endmacro %}

{% macro logo(size=32) -%}
<svg class="logo-mark" width="{{ size }}" height="{{ size }}" viewBox="0 0 32 32" aria-hidden="true">
  <rect width="32" height="32" rx="9" fill="#ff3b57"/>
  <rect x="8" y="14" width="3.5" height="10" rx="1.75" fill="#fff"/>
  <rect x="14.25" y="8" width="3.5" height="16" rx="1.75" fill="#fff"/>
  <rect x="20.5" y="11" width="3.5" height="13" rx="1.75" fill="#fff"/>
</svg>
{%- endmacro %}
